name: Refresh Snapshot & Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      supplement_url:
        description: "可选：附加补录的公开相亲网页 URL (http/https)"
        required: false
        default: ""
        type: string
      city_hint:
        description: "可选：补录链接默认城市（如 北京 / 上海 / 深圳）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh public snapshot on schedule or manual dispatch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SUPPLEMENT_URL: ${{ inputs.supplement_url }}
          CITY_HINT: ${{ inputs.city_hint }}
        run: |
          python3 scripts/update_public_snapshot.py \
            --supplement-url "${SUPPLEMENT_URL}" \
            --city-hint "${CITY_HINT}"

      - name: Validate snapshot JSON integrity & PII masking
        run: |
          python3 - <<'PY'
          import json, re
          with open("public/data/snapshot.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data.get("candidates"), list) and len(data["candidates"]) > 0, "Empty candidates!"
          raw = json.dumps(data, ensure_ascii=False, allow_nan=False)
          assert len(re.findall(r"(?<!\d)1[3-9]\d{9}(?!\d)", raw)) == 0, "Unmasked phone number detected!"
          print("Snapshot verified:", data.get("meta"))
          PY

      - name: Commit updated snapshot back to main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet public/data/snapshot.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/snapshot.json
            git commit -m "chore(data): update public blind-date snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
